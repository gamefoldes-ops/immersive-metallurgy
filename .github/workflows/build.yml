name: Build

# Everyday iteration happens locally (./gradlew deploy), and minutes are metered on a private repo,
# so CI only proves the release build: version tags, a manual run, and a weekly clean-clone check.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build