modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/gamefoldes-ops/immersive-metallurgy/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/gamefoldes-ops/immersive-metallurgy"
authors="gamefoldes-ops"
description='''
TerraFirmaCraft addon about the dirt in metal: ore brings gangue into the bath, an off-proportion melt pours
flawed metal instead of burning away, and what is wrong with a casting - brittle, soft, cold-shut - costs the
tool made from it edge, damage and structure. Crush and wash the rock, or skim and flux the bath, to get clean
metal out of either.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="tfc"
    type="required"
    versionRange="${tfc_version_range}"
    ordering="AFTER"
    side="BOTH"
