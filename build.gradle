plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

version = mod_version
group = mod_group_id

repositories {
    exclusiveContent {
        forRepository {
            maven { url = 'https://api.modrinth.com/maven' }
        }
        filter { includeGroup 'maven.modrinth' }
    }
    exclusiveContent {
        forRepository {
            maven { url = 'https://maven.blamejared.com' }
        }
        filter { includeGroup 'vazkii.patchouli' }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21) // Mojang ships Java 21 to players in 1.21.1

// Whoever ends up holding only the jar should still be able to read what they may do with it.
tasks.named('jar', Jar).configure {
    from rootProject.file('LICENSE')
    from rootProject.file('README.md')
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        // Enhanced class redefinition only exists in JetBrains Runtime; the ignore-flag keeps other JDKs from rejecting it
        jvmArguments '-XX:+IgnoreUnrecognizedVMOptions', '-XX:+AllowEnhancedClassRedefinition'
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    // Runs the registered gametests and exits. Started by `./gradlew runGameTestServer`.
    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }
}

// TFC and Patchouli are load-only: the mod compiles against them and dev runs need them present, but a
// dependent of this mod must not inherit either as a dependency of its own.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    compileOnly "maven.modrinth:terrafirmacraft:${tfc_version}"
    localRuntime "maven.modrinth:terrafirmacraft:${tfc_version}"
    localRuntime "vazkii.patchouli:Patchouli:${patchouli_version}"
}

// The only place the version, license and dependency ranges are written once: they are substituted into
// neoforge.mods.toml here, so a release bump is a gradle.properties edit and nothing else.
tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            tfc_version_range      : tfc_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Launcher instance that receives the built jar. Resolved without hard-coding a user path:
// -Pdeploy_mods_dir=<dir> wins, otherwise the "TFC + Millenaire" profile inside the default .minecraft.
def deployModsDir = providers.gradleProperty('deploy_mods_dir')
        .orElse(providers.environmentVariable('USERPROFILE')
                .map { new File(it, 'AppData/Roaming/.minecraft/versions/TFC+Millenaire/mods').absolutePath })

tasks.register('deploy', Copy) {
    group = 'deployment'
    description = "Builds the jar and copies it into the launcher instance in deploy_mods_dir"
    dependsOn 'build'
    from layout.buildDirectory.dir('libs')
    include "${mod_id}-${mod_version}.jar"
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    // No launcher instance exists off-Windows, so the task must configure cleanly without one
    if (deployModsDir.isPresent()) {
        into deployModsDir.get()
    } else {
        enabled = false
        description = "Skipped: set -Pdeploy_mods_dir=<dir>; the auto-detected path needs USERPROFILE (Windows)"
    }
}
